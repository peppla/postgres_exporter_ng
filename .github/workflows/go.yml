name: Go

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:

jobs:
  test:
    name: Test
    strategy:
      matrix:
        postgresql-image:
          # Supported means not end-of-life. PostgreSQL 13 reached end of life
          # on 2025-11-13 and 14 on 2026-11-12, so neither is tested. Add the
          # next major when it is released, and drop the oldest when its five
          # years are up: https://www.postgresql.org/support/versioning/
          - postgres:15
          - postgres:16
          - postgres:17
          - postgres:18
          - postgres:19
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: ${{ github.workspace }}/go.mod

    - name: Run Tests
      run: |
        sudo chown 999:999 testdata/ssl/server/*
        sudo chmod 600 testdata/ssl/server/*
        docker compose up -d
        make
        make test
      env:
        POSTGRESQL_IMAGE: ${{ matrix.postgresql-image }}

    - name: Run debug commands on failure
      if: ${{ failure() }}
      run: |
        env | sort
        go env | sort
        git status
        docker --version
        docker compose --version
        docker compose logs
