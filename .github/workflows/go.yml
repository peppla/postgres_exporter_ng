name: Go

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version-file: ${{ github.workspace }}/go.mod

    # No database here. Every test outside the integration build tag uses
    # sqlmock or parses strings, so running this once is enough and running it
    # once per PostgreSQL version proves nothing about those versions.
    - name: Run Tests
      run: |
        make
        make test

  integration:
    name: Integration ${{ matrix.postgresql-image }}
    strategy:
      fail-fast: false
      matrix:
        postgresql-image:
          # Supported means not end-of-life. PostgreSQL 13 reached end of life
          # on 2025-11-13 and 14 on 2026-11-12, so neither is tested. Add the
          # next major when it is released, and drop the oldest when its five
          # years are up: https://www.postgresql.org/support/versioning/
          - postgres:15
          - postgres:16
          - postgres:17
          - postgres:18
          - postgres:19
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version-file: ${{ github.workspace }}/go.mod

    # Only the plain server. The SSL service in docker-compose.yml needs its
    # key files chowned to the postgres uid and no test connects to it.
    - name: Start PostgreSQL
      run: docker compose up -d postgresql
      env:
        POSTGRESQL_IMAGE: ${{ matrix.postgresql-image }}

    # Over TCP, not the Unix socket. The official image runs a temporary
    # server during initialisation with listen_addresses='' and then stops it
    # before starting the real one, so a socket check can pass against a
    # server that is about to go away. The temporary server has no TCP
    # listener, which is what makes this check wait for the right one.
    - name: Wait for PostgreSQL
      run: |
        for _ in $(seq 1 60); do
          if docker exec postgres_exporter_postgresql \
               pg_isready -h 127.0.0.1 -p 5432 -U root -d postgres; then
            exit 0
          fi
          sleep 1
        done
        echo "PostgreSQL did not become ready" >&2
        docker compose logs postgresql
        exit 1

    - name: Report the server version
      run: |
        docker exec -e PGPASSWORD=root postgres_exporter_postgresql \
          psql -h 127.0.0.1 -p 5432 -U root -d postgres -qtAc 'SELECT version();'

    # These tests are behind //go:build integration and connect to the server
    # started above. Nothing in the Makefiles sets that tag, so without this
    # step they do not run and the matrix starts a database per version to run
    # tests that never open a connection. DATA_SOURCE_NAME is required by the
    # suite, which fails rather than skipping if it is unset.
    #
    # Every package, not just cmd. The collector package has its own
    # integration tests now, for the questions only a server can answer, such
    # as the order a query returns its columns in.
    - name: Run integration tests
      run: go test -tags integration -race -count=1 -v ./...
      env:
        DATA_SOURCE_NAME: postgresql://root:root@127.0.0.1:5432/postgres?sslmode=disable

    - name: Run debug commands on failure
      if: ${{ failure() }}
      run: |
        env | sort
        go env | sort
        git status
        docker --version
        docker compose --version
        docker compose logs
